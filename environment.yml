name: neuralCAD-edit
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - itables
    - pandas
    - mongita
    - cadquery
    - pyarrow
    - ray
    - openai
    - anthropic
    - google-genai
    - google-adk>=2.7.0
    - python-dotenv>=1.2.2
    - json-repair
    - scikit-learn
    - open3d
    - torch
    - transformers
    - pillow
    - probreg
    - scipy
    - pyobjc-framework-Cocoa; sys_platform == 'darwin'
    - pytest>=9
# Conda does not install the project itself: run scripts and pytest from the repository root
# with PYTHONPATH=. (uv sync does this for you through an editable install).
